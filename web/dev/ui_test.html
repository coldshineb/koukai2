<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>UW2 選單測試 (開發工具)</title>
<style>
  body { background:#222; color:#ddd; font:14px sans-serif; margin:0; display:flex; }
  #side { width:300px; padding:10px; box-sizing:border-box; }
  #side button { display:block; width:100%; margin:4px 0; }
  #side label { display:block; margin:6px 0; }
  #log { white-space:pre-wrap; font-family:monospace; font-size:12px; background:#111; padding:6px; height:300px; overflow:auto; }
  canvas { image-rendering: pixelated; width:1280px; height:960px; background:#000; }
</style>
</head>
<body>
<div id="side">
  <label>MENU.DAT 編號 <input id="mn" type="number" value="58" min="0" max="60"></label>
  <label><input id="cancel" type="checkbox" checked> 可取消</label>
  <label><input id="anim" type="checkbox" checked> 動畫效果</label>
  <button id="b_list">直式選單 (14364)</button>
  <button id="b_popup">滑鼠位置彈出選單 (1458c)</button>
  <button id="b_yesno">是/否 確認 (1469c)</button>
  <button id="b_msg">訊息 + 等待按鍵 (56ee + 147ab)</button>
  <label>MESSAGE.DAT 編號 <input id="msgn" type="number" value="0" min="0" max="1021"></label>
  <div id="log"></div>
</div>
<canvas id="c"></canvas>
<script type="module" src="./ui_test.js"></script>
</body>
</html>
