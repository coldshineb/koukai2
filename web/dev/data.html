<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>UW2 遊戲資料檢視器 (開發工具)</title>
<style>
  body { background:#1e1e1e; color:#ddd; font:13px sans-serif; margin:0; display:flex; height:100vh; }
  #side { width:260px; padding:10px; box-sizing:border-box; overflow:auto; border-right:1px solid #444; }
  #side button { display:block; width:100%; text-align:left; margin:2px 0; background:#2d2d2d; color:#ddd; border:1px solid #444; padding:4px; cursor:pointer; }
  #side button.on { background:#3a5a8a; }
  #main { flex:1; overflow:auto; padding:10px; }
  table { border-collapse:collapse; font-family:monospace; font-size:12px; }
  th, td { border:1px solid #444; padding:2px 6px; white-space:nowrap; }
  th { background:#2d2d2d; position:sticky; top:0; }
  td.u { color:#777; }
  .note { color:#aaa; margin:6px 0 10px; white-space:pre-wrap; }
  select { width:100%; margin-bottom:8px; }
</style>
</head>
<body>
<div id="side">
  <select id="src"><option value="world">新遊戲初值 (world.json)</option></select>
  <div id="list"></div>
</div>
<div id="main"></div>
<script type="module" src="./data.js"></script>
</body>
</html>
