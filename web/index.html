<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大航海时代 II</title>
<style>
  html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  /* 按窗口大小等比缩放 (640×480 = 4:3，与原版显示器比例相同)，不限整数倍；缩放时保持像素锐利 */
  canvas { display:block; width:min(100vw, calc(100vh * 4 / 3)); height:min(100vh, calc(100vw * 3 / 4));
           width:min(100vw, calc(100dvh * 4 / 3)); height:min(100dvh, calc(100vw * 3 / 4));
           image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
